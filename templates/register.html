<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crear Cuenta - Detección de Tumores Cerebrales</title>
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/icon/Icono-TumorIA.jpg') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body class="auth-body">
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="auth-container auth-register page-content page-fade">
    <div class="card">
      <div class="card-header auth-header">
        <h2 class="auth-title">Crear Cuenta</h2>
      </div>
      <div class="card-body p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar" title="Cerrar"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
          <div class="mb-3">
            <label class="form-label" for="username">Nombre de usuario</label>
            <input 
              class="form-control" 
              id="username" 
              name="username" 
              type="text" 
              placeholder="Elige un nombre de usuario"
              minlength="3"
              required
            />
            <div class="form-text">Mínimo 3 caracteres</div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="email">Correo Electrónico</label>
            <input 
              class="form-control" 
              id="email" 
              name="email" 
              type="email" 
              placeholder="tu@email.com"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input 
              class="form-control" 
              id="password" 
              name="password" 
              type="password" 
              placeholder="Crea una contraseña segura"
              minlength="6"
              required
            />
            <div class="form-text">Mínimo 6 caracteres</div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="password_confirm">Confirmar Contraseña</label>
            <input 
              class="form-control" 
              id="password_confirm" 
              name="password_confirm" 
              type="password" 
              placeholder="Repite tu contraseña"
              minlength="6"
              required
            />
          </div>

          <button class="btn btn-primary w-100 btn-lg" type="submit">
            Crear Cuenta
          </button>
        </form>

        <div class="auth-link">
          ¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
