<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crear Cuenta - Detección de Tumores Cerebrales</title>
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/icon/Icono-TumorIA.jpg') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .register-container {
      width: 100%;
      max-width: 500px;
      padding: 15px;
    }
    .card {
      border: none;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .card-header {
      background: linear-gradient(135deg, #334db3 0%, #1976d2 50%, #0e3a76 100%);
      border-radius: 10px 10px 0 0;
      padding: 30px 20px;
      text-align: center;
      border: none;
    }
    .card-header h2 {
      color: white;
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    .form-control {
      border-radius: 5px;
      padding: 12px;
      border: 1px solid #dee2e6;
    }
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    .btn-register {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      font-weight: 600;
      padding: 10px;
      border-radius: 5px;
    }
    .btn-register:hover {
      background: linear-gradient(135deg, #5568d3 0%, #6a3e91 100%);
      color: white;
    }
    .login-link {
      text-align: center;
      margin-top: 20px;
    }
    .login-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
    .alert {
      border-radius: 5px;
    }
    .form-text {
      font-size: 0.85rem;
      color: #6c757d;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="card">
      <div class="card-header">
        <h2>Crear Cuenta</h2>
      </div>
      <div class="card-body p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar" title="Cerrar"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
          <div class="mb-3">
            <label class="form-label" for="username">Nombre de usuario</label>
            <input 
              class="form-control" 
              id="username" 
              name="username" 
              type="text" 
              placeholder="Elige un nombre de usuario"
              minlength="3"
              required
            />
            <div class="form-text">Mínimo 3 caracteres</div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="email">Correo Electrónico</label>
            <input 
              class="form-control" 
              id="email" 
              name="email" 
              type="email" 
              placeholder="tu@email.com"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input 
              class="form-control" 
              id="password" 
              name="password" 
              type="password" 
              placeholder="Crea una contraseña segura"
              minlength="6"
              required
            />
            <div class="form-text">Mínimo 6 caracteres</div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="password_confirm">Confirmar Contraseña</label>
            <input 
              class="form-control" 
              id="password_confirm" 
              name="password_confirm" 
              type="password" 
              placeholder="Repite tu contraseña"
              minlength="6"
              required
            />
          </div>

          <button class="btn btn-register w-100 btn-lg" type="submit">
            Crear Cuenta
          </button>
        </form>

        <div class="login-link">
          ¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
