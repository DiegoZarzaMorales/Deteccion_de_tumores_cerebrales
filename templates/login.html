<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar Sesión - Detección de Tumores Cerebrales</title>
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/icon/Icono-TumorIA.jpg') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body class="auth-body">
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="auth-container page-content page-fade">
    <div class="card">
      <div class="card-header auth-header">
        <h2 class="auth-title">TumorIA</h2>
        <p class="auth-subtitle">Iniciar Sesión</p>
      </div>
      <div class="card-body p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar" title="Cerrar"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
          <div class="mb-3">
            <label class="form-label" for="username">Nombre de usuario</label>
            <input
              class="form-control"
              id="username"
              name="username"
              type="text"
              placeholder="Ingresa tu usuario"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input
              class="form-control"
              id="password"
              name="password"
              type="password"
              placeholder="Ingresa tu contraseña"
              required
            />
          </div>

          <div class="mb-3 form-check">
            <input
              class="form-check-input"
              id="remember"
              name="remember"
              type="checkbox"
            />
            <label class="form-check-label" for="remember">
              Recuérdame
            </label>
          </div>

          <button class="btn btn-primary w-100 btn-lg" type="submit">
            Iniciar Sesión
          </button>
        </form>

        <div class="auth-link">
          ¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate aquí</a>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
