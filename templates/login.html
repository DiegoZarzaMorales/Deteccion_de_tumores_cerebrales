<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar Sesión - Detección de Tumores Cerebrales</title>
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/icon/Icono-TumorIA.jpg') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 15px;
    }
    .card {
      border: none;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .card-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px 10px 0 0;
      padding: 30px 20px;
      text-align: center;
      border: none;
    }
    .card-header h2 {
      color: white;
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    .form-control {
      border-radius: 5px;
      padding: 12px;
      border: 1px solid #dee2e6;
    }
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    .btn-login {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      font-weight: 600;
      padding: 10px;
      border-radius: 5px;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #5568d3 0%, #6a3e91 100%);
      color: white;
    }
    .register-link {
      text-align: center;
      margin-top: 20px;
    }
    .register-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    .register-link a:hover {
      text-decoration: underline;
    }
    .alert {
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="card">
      <div class="card-header">
        <h2>Iniciar Sesión</h2>
        <p class="text-white-50 mb-0 mt-2">Detección de Tumores Cerebrales</p>
      </div>
      <div class="card-body p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar" title="Cerrar"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
          <div class="mb-3">
            <label class="form-label" for="username">Nombre de usuario</label>
            <input 
              class="form-control" 
              id="username" 
              name="username" 
              type="text" 
              placeholder="Ingresa tu usuario"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input 
              class="form-control" 
              id="password" 
              name="password" 
              type="password" 
              placeholder="Ingresa tu contraseña"
              required
            />
          </div>

          <div class="mb-3 form-check">
            <input 
              class="form-check-input" 
              id="remember" 
              name="remember" 
              type="checkbox"
            />
            <label class="form-check-label" for="remember">
              Recuérdame
            </label>
          </div>

          <button class="btn btn-login w-100 btn-lg" type="submit">
            Iniciar Sesión
          </button>
        </form>

        <div class="register-link">
          ¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate aquí</a>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
