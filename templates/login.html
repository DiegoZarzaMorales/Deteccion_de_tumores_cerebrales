<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar Sesión - Detección de Tumores Cerebrales</title>
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/icon/Icono-TumorIA.jpg') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: transparent;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 15px;
    }
    .card {
      border: none;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .card-header {
      background: linear-gradient(135deg, #334db3 0%, #1976d2 50%, #0e3a76 100%);
      border-radius: 10px 10px 0 0;
      padding: 30px 20px;
      text-align: center;
      border: none;
    }
    .card-header h2 {
      color: white;
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    .form-control {
      border-radius: 5px;
      padding: 12px;
      border: 1px solid #dee2e6;
    }
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    .btn-login {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      font-weight: 600;
      padding: 10px;
      border-radius: 5px;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #5568d3 0%, #6a3e91 100%);
      color: white;
    }
    .register-link {
      text-align: center;
      margin-top: 20px;
    }
    .register-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    .register-link a:hover {
      text-decoration: underline;
    }
    .alert {
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="login-container">
    <div class="card">
      <div class="card-header">
        <h2>TumorIA</h2>
        <p class="text-white-50 mb-0 mt-2">Iniciar Sesión</p>
      </div>
      <div class="card-body p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar" title="Cerrar"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
          <div class="mb-3">
            <label class="form-label" for="username">Nombre de usuario</label>
            <input 
              class="form-control" 
              id="username" 
              name="username" 
              type="text" 
              placeholder="Ingresa tu usuario"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input 
              class="form-control" 
              id="password" 
              name="password" 
              type="password" 
              placeholder="Ingresa tu contraseña"
              required
            />
          </div>

          <div class="mb-3 form-check">
            <input 
              class="form-check-input" 
              id="remember" 
              name="remember" 
              type="checkbox"
            />
            <label class="form-check-label" for="remember">
              Recuérdame
            </label>
          </div>

          <button class="btn btn-login w-100 btn-lg" type="submit">
            Iniciar Sesión
          </button>
        </form>

        <div class="register-link">
          ¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate aquí</a>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
  <script>
  (function() {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [], gridLines = [];
    const PARTICLE_COUNT = 200;
    const CONNECTION_DISTANCE = 120;
    const GRID_SPACING = 60;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initGrid();
    }

    function initGrid() {
      gridLines = [];
      for (let y = height * 0.4; y < height + 100; y += GRID_SPACING) {
        gridLines.push({ y: y, type: 'h' });
      }
      for (let x = -200; x < width + 200; x += GRID_SPACING) {
        gridLines.push({ x: x, type: 'v' });
      }
    }

    function createParticle() {
      return {
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.8,
        vy: (Math.random() - 0.5) * 0.8,
        size: Math.random() * 2 + 1,
        brightness: Math.random() * 0.5 + 0.5,
        pulse: Math.random() * Math.PI * 2
      };
    }

    function init() {
      resize();
      particles = [];
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(createParticle());
      }
    }

    function drawGrid(time) {
      const vanishY = height * 0.35;
      const vanishX = width / 2;

      gridLines.filter(l => l.type === 'h').forEach((line, i) => {
        const progress = (line.y - vanishY) / (height - vanishY);
        const alpha = Math.max(0, Math.min(0.15, progress * 0.2));
        const glow = Math.sin(time * 0.001 + i * 0.3) * 0.05 + 0.1;
        
        ctx.beginPath();
        ctx.strokeStyle = `rgba(0, 150, 255, ${alpha + glow})`;
        ctx.lineWidth = 1;
        ctx.moveTo(0, line.y);
        ctx.lineTo(width, line.y);
        ctx.stroke();
      });

      gridLines.filter(l => l.type === 'v').forEach((line, i) => {
        const glow = Math.sin(time * 0.0015 + i * 0.2) * 0.03 + 0.08;
        
        ctx.beginPath();
        ctx.strokeStyle = `rgba(0, 120, 255, ${glow})`;
        ctx.lineWidth = 1;
        ctx.moveTo(vanishX, vanishY);
        ctx.lineTo(line.x, height + 50);
        ctx.stroke();
      });
    }

    function drawParticles(time) {
      particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.pulse += 0.02;

        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        const pulse = Math.sin(p.pulse) * 0.3 + 0.7;
        const alpha = p.brightness * pulse;

        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 4);
        gradient.addColorStop(0, `rgba(100, 200, 255, ${alpha})`);
        gradient.addColorStop(0.5, `rgba(0, 150, 255, ${alpha * 0.3})`);
        gradient.addColorStop(1, 'rgba(0, 100, 200, 0)');

        ctx.beginPath();
        ctx.fillStyle = gradient;
        ctx.arc(p.x, p.y, p.size * 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = `rgba(150, 220, 255, ${alpha})`;
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawConnections() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < CONNECTION_DISTANCE) {
            const alpha = (1 - dist / CONNECTION_DISTANCE) * 0.4;
            ctx.beginPath();
            ctx.strokeStyle = `rgba(0, 180, 255, ${alpha})`;
            ctx.lineWidth = 1;
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    function drawDataStreams(time) {
      const streamCount = 5;
      for (let i = 0; i < streamCount; i++) {
        const progress = ((time * 0.0005 + i * 0.2) % 1);
        const x = (width * 0.2) + (i * width * 0.15);
        const y = progress * height * 1.5 - height * 0.25;
        const alpha = Math.sin(progress * Math.PI) * 0.6;

        if (alpha > 0.1) {
          ctx.beginPath();
          const gradient = ctx.createLinearGradient(x, y - 50, x, y + 50);
          gradient.addColorStop(0, 'rgba(0, 200, 255, 0)');
          gradient.addColorStop(0.5, `rgba(100, 220, 255, ${alpha})`);
          gradient.addColorStop(1, 'rgba(0, 200, 255, 0)');
          ctx.strokeStyle = gradient;
          ctx.lineWidth = 2;
          ctx.moveTo(x, y - 50);
          ctx.lineTo(x, y + 50);
          ctx.stroke();
        }
      }
    }

    function animate(time) {
      const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
      bgGradient.addColorStop(0, '#020817');
      bgGradient.addColorStop(0.5, '#061428');
      bgGradient.addColorStop(1, '#0a1e3a');
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, width, height);

      drawGrid(time);
      drawConnections();
      drawParticles(time);

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    init();
    requestAnimationFrame(animate);
  })();
  </script>
</body>
</html>
