<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar Sesión - Detección de Tumores Cerebrales</title>
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/icon/Icono-TumorIA.jpg') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: transparent;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 15px;
    }
    .card {
      border: none;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .card-header {
      background: linear-gradient(135deg, #334db3 0%, #1976d2 50%, #0e3a76 100%);
      border-radius: 10px 10px 0 0;
      padding: 30px 20px;
      text-align: center;
      border: none;
    }
    .card-header h2 {
      color: white;
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    .form-control {
      border-radius: 5px;
      padding: 12px;
      border: 1px solid #dee2e6;
    }
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    .btn-login {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      font-weight: 600;
      padding: 10px;
      border-radius: 5px;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #5568d3 0%, #6a3e91 100%);
      color: white;
    }
    .register-link {
      text-align: center;
      margin-top: 20px;
    }
    .register-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    .register-link a:hover {
      text-decoration: underline;
    }
    .flash-toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
    }
    .flash-toast {
      min-width: 300px;
      max-width: 420px;
      padding: 15px 18px;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      border-left: 5px solid #667eea;
      background: rgba(15, 23, 42, 0.96);
      color: #ecf3ff;
      font-size: 0.95rem;
      line-height: 1.4;
      opacity: 0;
      transform: translateX(18px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: auto;
      position: relative;
      overflow: hidden;
    }
    .flash-toast.show {
      opacity: 1;
      transform: translateX(0);
    }
    .flash-toast.success {
      border-left-color: #22c55e;
    }
    .flash-toast.danger {
      border-left-color: #ef4444;
    }
    .flash-toast.warning {
      border-left-color: #f59e0b;
    }
    .flash-toast .toast-close {
      position: absolute;
      top: 8px;
      right: 10px;
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.8);
      font-size: 1.1rem;
      cursor: pointer;
    }
    .flash-toast .toast-progress {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      background: linear-gradient(90deg, rgba(103, 232, 249, 0.9), rgba(96, 165, 250, 0.9));
      width: 100%;
      transform-origin: left center;
      animation: toast-timer 4s linear forwards;
    }
    .flash-toast.success .toast-progress {
      background: linear-gradient(90deg, rgba(34, 197, 94, 0.9), rgba(16, 185, 129, 0.9));
    }
    .flash-toast.danger .toast-progress {
      background: linear-gradient(90deg, rgba(239, 68, 68, 0.9), rgba(248, 113, 113, 0.9));
    }
    .flash-toast.warning .toast-progress {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.9), rgba(251, 191, 36, 0.9));
    }
    @keyframes toast-timer {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="flash-toast-container" id="flash-toast-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-toast {{ category }} show" role="alert" data-category="{{ category }}">
            <button type="button" class="toast-close" aria-label="Cerrar" title="Cerrar">×</button>
            {{ message }}
            <div class="toast-progress"></div>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>
  <div class="login-container">
    <div class="card">
      <div class="card-header">
        <h2>TumorIA</h2>
        <p class="text-white-50 mb-0 mt-2">Iniciar Sesión</p>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label" for="username">Nombre de usuario</label>
            <input 
              class="form-control" 
              id="username" 
              name="username" 
              type="text" 
              placeholder="Ingresa tu usuario"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input 
              class="form-control" 
              id="password" 
              name="password" 
              type="password" 
              placeholder="Ingresa tu contraseña"
              required
            />
          </div>

          <div class="mb-3 form-check">
            <input 
              class="form-check-input" 
              id="remember" 
              name="remember" 
              type="checkbox"
            />
            <label class="form-check-label" for="remember">
              Recuérdame
            </label>
          </div>

          <button class="btn btn-login w-100 btn-lg" type="submit">
            Iniciar Sesión
          </button>
        </form>

        <div class="register-link">
          ¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate aquí</a>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
  <script>
  (function() {
    const toasts = document.querySelectorAll('.flash-toast');
    toasts.forEach((toast) => {
      const closeButton = toast.querySelector('.toast-close');
      const hideToast = () => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 350);
      };

      if (closeButton) {
        closeButton.addEventListener('click', hideToast);
      }

      setTimeout(hideToast, 4200);
    });
  })();
  </script>
  <script src="{{ url_for('static', filename='background-animation.js') }}"></script>
</body>
</html>
